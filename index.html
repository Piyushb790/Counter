<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1 class="count">0</h1>

        <div class="inc-dec">Increment/Decrement by: <span><input type="number" value=1 class="changeBy"></span></div>
        <button class="reset">reset</button>
    </div>
</body>
</html>
